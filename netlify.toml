[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA : toutes les routes (/fr, /fr/champion, /admin…) servent index.html.
# Les fichiers existants (assets, /media, /logos, robots.txt) restent prioritaires.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
